<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1910" viewBox="0 0 1080 1910" role="img" aria-labelledby="title description">
<title id="title">ERD thiết kế của ShopHub theo mô-đun</title>
<desc id="description">Mười bảy bảng nghiệp vụ. Mười hai bảng có migration, bốn bảng đơn hàng và bảng banners thuộc thiết kế dự kiến.</desc>
